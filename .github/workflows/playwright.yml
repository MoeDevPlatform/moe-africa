name: Playwright Order UI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  order-ui:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (Linux)
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        run: npm run build
        env:
          # Preview serves static assets; API calls are mocked in these specs.
          VITE_API_BASE_URL: http://127.0.0.1:3000

      - name: Start Vite preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "Preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview failed to start"; cat /tmp/vite-preview.log; exit 1

      - name: Run order and messaging Playwright regressions
        run: |
          npx playwright test \
            tests/playwright/order-rating-review.spec.ts \
            tests/playwright/order-production-quality.spec.ts \
            tests/playwright/admin-messaging-regression.spec.ts \
            tests/playwright/test-order-simulator.spec.ts \
            --project=desktop \
            --reporter=list
        env:
          CI: "true"
          PLAYWRIGHT_MOCK_AUTH: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          MOE_API_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-order-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then kill "$(cat /tmp/vite-preview.pid)" || true; fi
